<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiteAvatar课堂模式</title><style>body{margin:0;background:#071322;color:white;font:16px sans-serif}video{width:100vw;height:100vh;object-fit:contain}#controls{position:absolute;top:12px;left:12px;right:12px;text-align:center;background:#0a2034dd;padding:12px;border-radius:10px}button{padding:12px 22px;background:#72dfe9;border:0;border-radius:9px;cursor:pointer}p{font-size:13px}</style><video id="video" autoplay playsinline></video><div id="controls"><button id="connect">连接课堂数字人</button><p id="status">请先关闭其他数字人会话，再点击连接。本页面不采集麦克风。</p></div><script>
'use strict';
const TEACHER_ORIGIN=__TEACHER_ORIGIN__;
const video=document.getElementById('video'),status=document.getElementById('status'),button=document.getElementById('connect');
let pc,dc,ac,stream,active=null,ready=false,queue=[],epoch=0,videoReady=false;
const tell=(type,extra={})=>parent.postMessage({protocol:'teacher213',type,...extra},TEACHER_ORIGIN);
function send(name,payload={}){if(dc?.readyState==='open')dc.send(JSON.stringify({header:{name,request_id:crypto.randomUUID()},payload}));}
function finish(error){const current=active;if(!current||(!error&&current.finishing))return;clearTimeout(current.timer);if(error){tell('failed',{id:current.id,error});active=null;setTimeout(pump,600);}else{current.finishing=true;current.timer=setTimeout(()=>{if(active!==current)return;tell('finished',{id:current.id});active=null;pump();},600);}}
function pump(){if(active||!ready||!queue.length)return;active=queue.shift();active.key=null;active.timer=setTimeout(()=>{send('Interrupt');finish('未收到数字人播放完成信号。请检查本机CosyVoice额度及服务日志。');},90000);send('SendHumanText',{text:'[[TEACHER213]]'+active.text,end_of_speech:true});}
function interrupt(){epoch++;send('Interrupt');queue.forEach(x=>tell('failed',{id:x.id,error:'Aborted'}));queue=[];finish('Aborted');}
function stop(){ready=false;interrupt();pc?.close();dc?.close();stream?.getTracks().forEach(t=>t.stop());ac?.close();pc=dc=ac=null;video.srcObject=null;videoReady=false;button.disabled=false;button.hidden=false;tell('ready',{ready:false});}
function maybeReady(){if(videoReady&&dc?.readyState==='open'&&pc?.connectionState==='connected'){ready=true;status.textContent='LiteAvatar课堂模式已连接';button.hidden=true;tell('ready',{ready:true});pump();}}
async function connect(){stop();button.disabled=true;status.textContent='正在连接…';try{ac=new AudioContext();void ac.resume().catch(()=>{});const dest=ac.createMediaStreamDestination(),osc=ac.createOscillator(),gain=ac.createGain();gain.gain.value=0;osc.connect(gain).connect(dest);osc.start();stream=dest.stream;const cfg=await fetch('/openavatarchat/initconfig').then(r=>{if(!r.ok)throw Error('读取RTC配置失败');return r.json();});pc=new RTCPeerConnection(cfg.rtc_configuration||{});const remote=new MediaStream();video.srcObject=remote;pc.ontrack=e=>{remote.addTrack(e.track);video.play().catch(()=>{status.textContent='请点击连接按钮允许声音播放';button.hidden=false;button.disabled=false;});};video.onplaying=()=>{videoReady=true;maybeReady();};pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){ready=false;tell('ready',{ready:false});status.textContent='连接断开，请重新连接';button.hidden=false;button.disabled=false;}else maybeReady();};pc.addTrack(stream.getAudioTracks()[0],stream);const canvas=document.createElement('canvas');canvas.width=16;canvas.height=16;canvas.getContext('2d').fillRect(0,0,16,16);const blank=canvas.captureStream(1).getVideoTracks()[0];stream.addTrack(blank);pc.addTrack(blank,stream);dc=pc.createDataChannel('text');dc.onopen=maybeReady;dc.onmessage=e=>{try{const m=JSON.parse(e.data),p=m.payload||{};if(m.header?.name==='ChatSignal'&&p.stream_type==='client_playback'&&active){if(p.type==='stream_begin'&&!active.key)active.key=p.stream_key;if(p.stream_key===active.key&&p.type==='stream_end')finish();if(p.stream_key===active.key&&p.type==='stream_cancel')finish('Aborted');}if(m.header?.name==='Error')finish('数字人服务返回错误，请查看本机日志');}catch{}};await pc.setLocalDescription(await pc.createOffer());if(pc.iceGatheringState!=='complete')await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('ICE收集超时，请检查TURN')),15000);const f=()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);pc.removeEventListener('icegatheringstatechange',f);resolve();}};pc.addEventListener('icegatheringstatechange',f);});const r=await fetch('/webrtc/offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:pc.localDescription.sdp,type:pc.localDescription.type,webrtc_id:crypto.randomUUID()})});const answer=await r.json();if(!r.ok||!answer.sdp)throw Error(answer.detail||'会话建立失败（可能已有其他会话）');await pc.setRemoteDescription(answer);}catch(e){stop();status.textContent=String(e);tell('error',{error:String(e)});}}
button.onclick=()=>{if(pc?.connectionState==='connected'){void ac?.resume();void video.play().then(maybeReady).catch(()=>{});}else void connect();};tell('loaded',{version:217});window.addEventListener('message',e=>{if(e.origin!==TEACHER_ORIGIN||e.source!==parent||e.data?.protocol!=='teacher213')return;const m=e.data;if(m.type==='speak'){if(!ready||typeof m.id!=='string'||typeof m.text!=='string'||!m.text.trim()||m.text.length>3000||queue.length>30){tell('failed',{id:m.id,error:'数字人尚未连接或任务过多'});return;}queue.push({id:m.id,text:m.text});pump();}else if(m.type==='interrupt')interrupt();else if(m.type==='stop')stop();else if(m.type==='connect'){if(!pc)void connect();}else if(m.type==='hello'){tell('loaded',{version:217});tell('ready',{ready});}});window.addEventListener('pagehide',stop);
</script></html>
